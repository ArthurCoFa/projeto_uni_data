{% extends 'layout.html' %}

{% block content %}
    <h3>Adicionar Pré-Requisito</h3>
    <form action="/disciplinas/{{ disciplina.id_disc }}/adicionar-pre-requisito" method="POST">

        <label for="pre-requisito">Coordenador do curso:</label>
            <select name="pre-requisito" id="pre-requisito" required>
                {% for di in disciplinas %}
                    <option value="{{ di.id_disc }}">{{ di.nome }}</option>
                {% endfor %}
            </select>

        <button type="submit">Cadastrar pre_requisitos</button>
    </form>

    <h1>Lista de Pré-Requisitos da Disciplina {{ disciplina.nome }}</h1>
        <table class="table table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for pre_requisito in pre_requisitos %}
                <tr>
                    <td>{{ pre_requisito.id_d }}</td>
                    <td>{{ pre_requisito.disciplina }}</td>
                    <td>
                        <a href="/disciplinas/{{ disciplina.id_disc }}/excluir-pre-requisito/{{ pre_requisito.id_d }}" 
                        class="btn btn-danger btn-sm" 
                        onclick="return confirm('Tem certeza que deseja excluir este aluno?')">
                        Excluir
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

{% endblock %}
