{% extends 'layout.html' %}

{% block content %}
<h3>Editar matricula</h3>

    <form action="/matriculas/{{ id_mat }}/editar-matricula/aluno/turma" method="POST" class="d-flex mb-3">
        
        <input type="number" step="any" name="nota" placeholder="Nota" required>

        <input type="int" name="frequencia" placeholder="Frequência" required>

        <button type="submit">Editar matricula</button>

    </form>
{% endblock %}
